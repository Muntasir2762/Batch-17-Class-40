<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript</title>
</head>

<body>


    <script>
        let j = 0;

        while (j <= 9) {
            console.log(j + " Hello world");
            j++;
        }

        let k = 0;

        do {
            console.log(k + " Hello world");

            k++;
        }

        while (k <= 9);

        let marks = [56, 67, 89, 54, 78, 87];

        marks.forEach((element) => {
            console.log(element);
        });
    </script>
</body>

</html>
